# AUDIO MASIVO — completa texto + audio de TODO el catálogo, en paralelo.
# Detalle del diseño en scripts/motor-shard.sh y scripts/apply-patches.ts.
#
# La CANTIDAD de sesiones sale de scripts/shards.mjs, no de acá: así se puede subir
# o bajar la paralelización con un push normal, sin volver a editar este archivo a
# mano por la web.
#
# Cada sesión toma su pedazo (reparto por resto: cubre todo sin repetir) y NO
# commitea —se pisarían el snapshot y el summary es irrecuperable—: sube su parche y
# el job final los junta. El guardado lo hace apply-patches.ts, que reintenta y
# falla en rojo si no puede.
#
# Arranca a medianoche de Argentina. Secrets: R2_*, OPENAI_API_KEY, VERCEL_*.
name: Audio masivo

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      sesiones_min:
        description: "Minutos de trabajo por sesión (el job muere a los 350)"
        default: "290"

concurrency:
  group: audio-masivo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.calc.outputs.shards }}
      total: ${{ steps.calc.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: calc
        run: node scripts/shards.mjs >> "$GITHUB_OUTPUT"

  generar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Que una sesión falle no debe cancelar a las demás.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.preparar.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Instalar deps
        run: |
          npm ci
          python3 -m venv .venv-tts
          .venv-tts/bin/pip install -q edge-tts

      - name: Preparar base desde el snapshot
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Generar (sesión ${{ matrix.shard }})
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.preparar.outputs.total }}
          PATCH_OUT: "parche-${{ matrix.shard }}.json"
          MOTOR_MIN: ${{ github.event.inputs.sesiones_min || '290' }}
        run: bash scripts/motor-shard.sh

      - name: Guardar el parche de esta sesión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parche-${{ matrix.shard }}
          path: parche-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: warn

  consolidar:
    needs: generar
    # Corre aunque alguna sesión se haya caído: lo generado se guarda igual.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci

      - name: Traer los parches de todas las sesiones
        uses: actions/download-artifact@v4
        with:
          pattern: parche-*
          path: parches

      - name: Aplicar, commitear y pushear
        run: npx tsx scripts/apply-patches.ts parches

      - name: Deploy a Vercel
        run: npx vercel deploy --prod --yes --force --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Cuánto falta
        if: always()
        run: npx tsx scripts/faltan.ts >> "$GITHUB_STEP_SUMMARY"
