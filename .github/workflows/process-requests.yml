# Procesa los TÍTULOS PEDIDOS por usuarios ("¿No encontraste tu título?").
# Cada par de horas lee la cola (Vercel Blob), ingesta cada pedido completo
# (libro + sinopsis + resumen ES/EN + audio Onyx/Nova), avisa al usuario y publica.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   BLOB_READ_WRITE_TOKEN   (mismo que en Vercel)
#   OPENAI_API_KEY
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   RESEND_API_KEY          (opcional: para avisar al USUARIO por mail; si falta, no manda)
# A VOS te avisa creando un "issue" en este repo cada vez que genera títulos nuevos
# (GitHub te manda el mail solo, sin cuentas ni dominios). No necesita ningún secret.
name: Procesar pedidos de títulos

on:
  schedule:
    - cron: "0 */2 * * *" # cada 2 horas
  workflow_dispatch:
    inputs:
      limite:
        description: "Máx. de pedidos por corrida"
        default: "10"

permissions:
  contents: write
  issues: write # para avisarte creando un issue cuando hay títulos nuevos

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar deps
        run: |
          npm ci
          python3 -m venv .venv-tts
          .venv-tts/bin/pip install -q edge-tts
      - name: Preparar base desde el snapshot
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - name: Procesar cola de pedidos
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REQ_LIMIT: ${{ github.event.inputs.limite || '10' }}
        run: npx tsx scripts/process-requests.ts
      - name: Avisarte (issue en GitHub → mail) si hubo títulos nuevos
        if: hashFiles('new-titles.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s new-titles.txt ]; then
            gh issue create \
              --title "📚 Títulos nuevos generados ($(date +%d/%m))" \
              --body-file new-titles.txt
          fi
      - name: Snapshot del catálogo
        run: npx tsx scripts/export-seed.ts
      - name: ¿Cambió el catálogo?
        id: diff
        run: |
          if git diff --quiet -- prisma/seed-data.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Sin títulos nuevos: no hace falta deploy."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit del snapshot
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "biblioteca-bot"
          git config user.email "bot@biblioteca.local"
          git add prisma/seed-data.json
          git commit -m "Títulos pedidos por usuarios (auto)" || echo "sin cambios"
          git push || echo "nada para pushear"
      - name: Deploy a Vercel
        if: steps.diff.outputs.changed == '1'
        run: npx vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
