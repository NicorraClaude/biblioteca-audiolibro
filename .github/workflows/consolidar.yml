# CONSOLIDAR — rescata el trabajo de una corrida de Audio masivo cuyo guardado falló.
#
# Las sesiones dejan su parche como artifact aunque después algo se rompa. Esto los
# baja y los aplica al catálogo. Sirve para recuperar corridas viejas (los artifacts
# duran 3 días) y para reintentar cuando el push se pierde por una carrera.
#
# El commit y el push los hace scripts/apply-patches.ts, que reintenta y falla en rojo
# si no puede. Nada de "|| echo" tapando errores.
#
# Uso: Run workflow → pegar el número de la corrida (está en la URL de la corrida).
name: Consolidar

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número de la corrida de Audio masivo a rescatar"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - run: npm ci

      - name: Traer los parches de esa corrida
        uses: actions/download-artifact@v4
        with:
          pattern: parche-*
          path: parches
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Aplicar, commitear y pushear
        run: npx tsx scripts/apply-patches.ts parches

      - name: Deploy a Vercel
        run: npx vercel deploy --prod --yes --force --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Cuánto falta
        if: always()
        run: npx tsx scripts/faltan.ts >> "$GITHUB_STEP_SUMMARY"
