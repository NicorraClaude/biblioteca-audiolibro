# PEDIDOS DE TÍTULOS — reemplaza a "Procesar pedidos de títulos" (process-requests.yml),
# que venía fallando al minuto cada 2 horas: el YAML viejo solo pasaba
# BLOB_READ_WRITE_TOKEN, pero el script exige R2 desde la migración.
#
# Corre cada 2 horas. Es lo que pidió una persona real, así que va seguido y no
# espera al motor diario. La lógica vive en scripts/motor-biblioteca.sh (con todo
# en 0 salvo PEDIDOS), que se puede cambiar con un push normal.
#
# Secrets: R2_*, OPENAI_API_KEY, VERCEL_*. RESEND_API_KEY es opcional (sin él, el
# aviso al usuario queda pendiente; el aviso a Nico va igual por issue de GitHub).
name: Pedidos de títulos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Máx. pedidos a procesar por corrida"
        default: "10"

concurrency:
  group: pedidos
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pedidos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Instalar deps
        run: |
          npm ci
          python3 -m venv .venv-tts
          .venv-tts/bin/pip install -q edge-tts

      - name: Preparar base desde el snapshot
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Atender pedidos
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PEDIDOS: ${{ github.event.inputs.limite || '10' }}
          MODERNOS: "0"
          BIBLIOTECA: "0"
          YOUTUBE: "0"
        run: bash scripts/motor-biblioteca.sh

      - name: Avisarte (issue en GitHub → mail) si hubo títulos nuevos
        if: hashFiles('new-titles.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s new-titles.txt ]; then
            gh issue create \
              --title "📚 Títulos nuevos generados ($(date +%d/%m))" \
              --body-file new-titles.txt
          fi

      - name: Snapshot del catálogo
        run: npx tsx scripts/export-seed.ts

      - name: ¿Cambió el catálogo?
        id: diff
        run: |
          if git diff --quiet -- prisma/seed-data.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Sin títulos nuevos: no hace falta deploy."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit del snapshot
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "biblioteca-bot"
          git config user.email "bot@biblioteca.local"
          git add prisma/seed-data.json
          git commit -m "Títulos pedidos por usuarios (auto)" || echo "sin cambios"
          git pull --rebase --autostash || true
          git push || echo "nada para pushear"

      - name: Deploy a Vercel
        if: steps.diff.outputs.changed == '1'
        run: npx vercel deploy --prod --yes --force --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
